<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0b0c">
<title>4 Kings Store – Moda Masculina</title>
<style id="css">
:root{--bg:#0b0b0c;--bg2:#121214;--card:#161618;--fg:#f4efe6;--mut:#a39b8c;--ac:#d4a94f;--cu:#b4663c;--bd:#2a2724;--grad:linear-gradient(135deg,#f3d891,#cf9f41 55%,#b4663c);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b0b0c}}
:root[data-theme="dark"]{--bg:#0b0b0c}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--fg);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:rgba(11,11,12,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);z-index:10}
header{position:sticky;top:env(safe-area-inset-top,0px);display:flex;align-items:center;justify-content:space-between;padding:10px 18px;z-index:11;background:rgba(11,11,12,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--bd)}
.logo{display:flex;align-items:center;gap:12px;cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent}
.logo img{width:46px;height:46px;border-radius:50%;display:block;box-shadow:0 0 0 1px var(--bd),0 0 18px rgba(212,169,79,.25)}
.logo b{font-size:17px;letter-spacing:.12em;line-height:1.1;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.logo b span{display:block;font-size:10px;font-weight:500;letter-spacing:.4em;-webkit-text-fill-color:var(--mut);color:var(--mut)}
.mobile-menu{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);right:18px;z-index:21;display:none}.mobile-menu>button{background:rgba(11,11,12,.9);border:1px solid var(--bd);border-radius:10px;color:var(--fg);padding:8px 12px}.mobile-menu nav{position:absolute;right:0;top:calc(100% + 10px);width:210px;padding:8px;background:var(--card);border:1px solid var(--bd);border-radius:14px;box-shadow:0 12px 30px #0009;z-index:20}.mobile-menu nav[hidden]{display:none}.mobile-menu a{display:block;padding:12px;border-radius:9px;color:var(--fg);text-decoration:none}.mobile-menu a:hover{background:var(--bg2);color:var(--ac)}
.availability{font-size:11px;color:var(--mut)}.availability.unavailable{color:#e08b7c}.product-sizes{font-size:12px;color:var(--mut)}
#tabs,#grid{scroll-margin-top:86px}
@media(max-width:700px){.mobile-menu{display:block}}
@media(max-width:700px){.hero{min-height:400px;background-position:center top,center,center 42%}}
button{font:inherit;cursor:pointer}
.btn{border:0;border-radius:12px;padding:10px 16px;font-weight:700;background:var(--grad);color:#1a1206;transition:transform .15s,filter .15s}
.btn{text-decoration:none;text-align:center}
.btn:hover{filter:brightness(1.08)}.btn:active{transform:scale(.97)}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--bd)}.btn.ghost:hover{border-color:var(--ac)}
.hero{position:relative;display:flex;flex-direction:column;justify-content:center;min-height:clamp(340px,34vw,440px);text-align:center;padding:56px 20px 48px;overflow:hidden;background-image:radial-gradient(600px 280px at 50% 0,rgba(212,169,79,.14),transparent 70%),linear-gradient(rgba(11,11,12,.68),rgba(11,11,12,.74)),url("banner-moda-masculina.jpg");background-position:center top,center,center 42%;background-size:600px 280px,cover,cover;background-repeat:no-repeat}
.kicker{letter-spacing:.35em;font-size:11px;color:var(--ac);margin-bottom:14px}
.hero h1{margin:0 0 12px;font-size:clamp(32px,8vw,60px);line-height:1.05;font-weight:800;letter-spacing:-.02em}
.hero h1 em{font-style:normal;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:var(--mut);margin:0 auto;max-width:460px}
.car{max-width:1100px;margin:0 auto;overflow:hidden;padding:6px 12px 30px}
.car .card{cursor:pointer;border-color:transparent;background:linear-gradient(180deg,#1f1f23,#141416);box-shadow:0 14px 30px rgba(0,0,0,.7),0 1px 0 rgba(255,255,255,.07) inset}
.car .card:hover{border-color:transparent;transform:translateY(-4px)}
.trk{display:flex;will-change:transform}
.sl{flex:0 0 100%;padding:0 6px}
.car .ph{aspect-ratio:4/3}
@media(min-width:900px){.sl{flex-basis:33.3333%}.car .ph{aspect-ratio:1}}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:4px 18px 18px;max-width:1100px;margin:auto;scrollbar-width:none}
.tabs button{white-space:nowrap;background:transparent;border:1px solid var(--bd);color:var(--mut);border-radius:999px;padding:8px 16px}
.tabs button.on{background:var(--grad);color:#1a1206;border-color:transparent;font-weight:700}
.tabs .category-more{display:block;flex:0 0 auto;width:38px;padding:6px;font-size:20px;line-height:1}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:16px;padding:0 18px 48px;max-width:1100px;margin:auto}
@media(max-width:700px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.load-more{max-width:1100px;margin:-30px auto 42px;padding:0 18px;display:flex;align-items:center;gap:14px;color:var(--mut);font-size:13px}
.load-more::before,.load-more::after{content:"";height:1px;flex:1;background:var(--bd)}
.load-more[hidden]{display:none}
.load-more button{border:0;background:transparent;color:var(--mut);padding:8px;letter-spacing:.06em}
.load-more button:hover{color:var(--ac)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;overflow:hidden;display:flex;flex-direction:column;transition:transform .2s,border-color .2s}
.card:hover{transform:translateY(-4px);border-color:var(--ac)}
.ph{overflow:hidden;aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:56px;background:radial-gradient(circle at 50% 35%,#2a2418,#121214)}
.card .in{padding:12px;display:flex;flex-direction:column;gap:6px;flex:1}
.card h3{margin:0;font-size:14px;font-weight:600}.chip{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--cu)}
.ph[data-g]{-webkit-tap-highlight-color:transparent;user-select:none}
.ph[data-g]::before,.ph[data-g]::after{z-index:2;position:absolute;top:50%;transform:translateY(-50%);color:#fff;font-size:26px;opacity:.75;text-shadow:0 1px 4px #000;pointer-events:none}
.ph[data-g]::before{content:"‹";left:8px}.ph[data-g]::after{content:"›";right:8px}
.gb{z-index:2;position:absolute;right:8px;bottom:8px;background:rgba(0,0,0,.65);color:var(--fg);font-size:11px;padding:2px 8px;border-radius:999px}
.pr{font-weight:800;color:var(--ac);font-size:16px}.sm{font-size:12px;color:var(--mut)}
.card .row{display:flex;margin-top:auto;padding-top:4px}.card .row .btn{flex:1;padding:10px;font-size:13px}
.grid .card{position:relative;border-color:transparent;background:linear-gradient(180deg,#1f1f23,#141416);box-shadow:0 8px 20px rgba(0,0,0,.55),0 1px 0 rgba(255,255,255,.06) inset;transition:transform .5s cubic-bezier(.22,.61,.36,1),box-shadow .5s}
.grid .card:hover{border-color:transparent}
@keyframes zin{from{transform:scale(1.05);opacity:.3}to{transform:scale(1);opacity:1}}
.zoom{animation:zin .85s cubic-bezier(.22,.61,.36,1)}
.pg{position:fixed;inset:0;background:var(--bg);z-index:25;display:none;overflow:auto}.pg.on{display:block}
.pgh{position:sticky;top:0;display:flex;align-items:center;gap:12px;padding:calc(14px + env(safe-area-inset-top,0px)) 18px 14px;background:rgba(11,11,12,.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--bd);z-index:2}.pgh h2{margin:0;font-size:20px;flex:1}
.pgb{max-width:900px;margin:0 auto;padding:16px 18px calc(40px + env(safe-area-inset-bottom,0px))}
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;margin:6px 0 14px}.kp{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:2px}.kp b{font-size:20px;color:var(--ac)}.kp span{font-size:12px;color:var(--mut)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;padding:16px;z-index:20}
.modal.on{display:flex}
.box{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:22px;width:100%;max-width:420px;max-height:90vh;overflow:auto}.box h2{margin-top:0}
input,select{width:100%;padding:12px;margin:4px 0 12px;border:1px solid var(--bd);border-radius:12px;background:var(--bg);color:var(--fg);font:inherit}
input:focus,select:focus{outline:none;border-color:var(--ac)}
textarea{display:block;width:100%;padding:12px;margin:4px 0 12px;border:1px solid var(--bd);border-radius:12px;background:var(--bg);color:var(--fg);font:inherit;resize:none;overflow:hidden;min-height:46px}
textarea:focus{outline:none;border-color:var(--ac)}
.in .sm,#pdD{white-space:pre-line}
label{font-size:13px;color:var(--mut)}
.it{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--bd);font-size:14px}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:8px 6px;border-bottom:1px solid var(--bd);text-align:left}
.note{font-size:12px;color:var(--mut)}
.x{background:transparent;border:1px solid var(--bd);color:var(--fg);width:36px;height:36px;border-radius:50%}
.th{width:76px;height:76px;flex:none;border-radius:12px;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:34px;background:radial-gradient(circle at 50% 35%,#2a2418,#121214)}.th img{width:100%;height:100%;object-fit:cover}
.inf{flex:1;min-width:0}.inf h4{margin:0 0 2px;font-size:14px;font-weight:600}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--grad);color:#1a1206;font-weight:700;padding:10px 18px;border-radius:999px;opacity:0;pointer-events:none;transition:.25s;z-index:30}
#toast.on{opacity:1;transform:translate(-50%,0)}
</style>
<script src="storefront.js"></script>
</head>

function optimizeImage(file){return new Promise((resolve,reject)=>{if(!file.type.startsWith("image/")){reject(new Error("Selecione um arquivo de imagem válido."));return}const r=new FileReader();r.onerror=()=>reject(new Error("Não foi possível ler a imagem."));r.onload=()=>{const im=new Image();im.onerror=()=>reject(new Error("Não foi possível abrir a imagem."));im.onload=()=>{try{const k=Math.min(1,700/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.max(1,Math.round(im.width*k));c.height=Math.max(1,Math.round(im.height*k));const ctx=c.getContext("2d");if(!ctx){reject(new Error("Não foi possível processar a imagem."));return}ctx.drawImage(im,0,0,c.width,c.height);c.toBlob(bl=>{if(!bl){reject(new Error("Não foi possível compactar a imagem."));return}const rr=new FileReader();rr.onerror=()=>reject(new Error("Não foi possível codificar a imagem."));rr.onload=()=>typeof rr.result==="string"?resolve(rr.result):reject(new Error("Formato de imagem inválido."));rr.readAsDataURL(bl)},"image/jpeg",.65)}catch(e){reject(e)}};if(typeof r.result==="string")im.src=r.result;else reject(new Error("Arquivo de imagem inválido."))};r.readAsDataURL(file)})}
